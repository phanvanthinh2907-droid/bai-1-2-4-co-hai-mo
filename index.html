<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cô hái mơ</title>
  <style>
    pre {
      font-family: "Times New Roman", serif; 
      font-size: 1.3em;
    }
  </style>
</head>
<body>
  <main>
    <h1 align="center">CÔ HÁI MƠ</h1>
<pre>
<i>Thơ thẩn đường chiều một khách thơ,</i>
<i>Say nhìn xa rặng núi xanh lơ,</i>
<b>Khí trời lặng lẽ và trong trẻo,</b>
<b>Thấp thoáng rừng mơ, Cô hái mơ.</b>
<u>Tác giả</u>: <s><i>Vô danh</i></s>
</pre>
    <hr>
    <p><small>Ghi chú: Bài thơ "Cô hái mơ" thật ra là của nhà thơ Nguyễn Bính.
      Ở đây gạch ngang chữ "Vô danh" để luyện thẻ &lt;s&gt;.</small></p>
  </main>
</body>
</html>
